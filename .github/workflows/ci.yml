name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker — typecheck, lint schema, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fails if src/db/schema.ts has drifted from migrations/ — a schema change
      # merged without its migration would otherwise only break at deploy time.
      - name: Check migrations are up to date with the schema
        run: |
          npx drizzle-kit generate --name ci-drift-check
          # --porcelain, not `git diff`: drift shows up as a brand new
          # (untracked) migration file, which `git diff` would not report.
          if [ -n "$(git status --porcelain migrations/)" ]; then
            echo "::error::src/db/schema.ts has drifted from migrations/. Run 'npm run db:generate' and commit the result."
            git status --porcelain migrations/
            exit 1
          fi
      - run: npm test
