[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Intentionally blank. alembic/env.py ignores this key and reads the URL from
# app.config.get_settings().database_url (TRIPLET_DATABASE_URL) so that there
# is exactly one source of connection settings and no credentials in the repo.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
